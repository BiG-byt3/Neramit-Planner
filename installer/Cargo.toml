[package]
name = "neramit-planner-setup"
version = "1.0.1"
authors = ["BiGByte Studio"]
edition = "2021"
description = "Neramit Planner per-user installer"
publish = false
build = "build.rs"

[[bin]]
name = "NeramitPlanner-Setup"
path = "src/main.rs"

[dependencies]
miniz_oxide = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_Storage_Xps"] }

[build-dependencies]
miniz_oxide = "0.8"
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
